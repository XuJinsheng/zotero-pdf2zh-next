[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-pdf2zh-next"
version = "5.6.1"
description = "Local PDF translation server for the Zotero zotero-pdf2zh-next plugin"
authors = [{name = "XuJinsheng"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    # SDK 2 switches the wire protocol to API 2026-06-06; keep the v3 China endpoint.
    "azure-ai-translation-text>=1.0.1,<2",
    "azure-core>=1.41.0",
    "bitstring>=4.4.0,<5",
    "chardet>=7.7.0",
    "charset-normalizer>=3.5.2",
    "configargparse>=1.8.0",
    "cryptography>=50.0.2",
    "deepl>=1.32.0",
    "flask>=3.1.3,<4",
    "freetype-py>=2.5.1",
    "httpx[socks]>=0.28.1",
    "hyperscan>=0.9.1",
    "levenshtein>=0.27.5",
    "msgpack>=1.2.3",
    "numpy>=2.5.4,<3",
    "ollama>=0.6.3",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "openai>=3.37.0",
    "opencv-python-headless>=5.0.0.93",
    "orjson>=3.13.0",
    "peewee>=4.5.3",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyclipper>=1.4.0",
    "pydantic>=2.14.1",
    "pymupdf>=2.0,<3",
    "pypdf>=6.21.2,<7",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "regex>=2026.9.29",
    "rich>=15.0.0",
    "rtree>=1.4.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "tenacity>=9.2.1",
    "tencentcloud-sdk-python-tmt>=3.1.129",
    "tiktoken>=0.14.0",
    "tomlkit>=0.15.2,<1",
    "tqdm>=4.70.1",
    "xinference-client>=4.1.0",
    "xsdata[lxml]>=26.10",
]

[project.urls]
Homepage = "https://github.com/XuJinsheng/zotero-pdf2zh-next"
Repository = "https://github.com/XuJinsheng/zotero-pdf2zh-next"
Issues = "https://github.com/XuJinsheng/zotero-pdf2zh-next/issues"
Changelog = "https://github.com/XuJinsheng/zotero-pdf2zh-next/blob/main/CHANGELOG.md"

[project.scripts]
zotero-pdf2zh-next = "server:main"

[tool.setuptools]
py-modules = ["server", "task_manager", "pdf2zh_next_service"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf2zh_next*", "babeldoc*", "rapidocr_onnxruntime*"]

[tool.setuptools.package-data]
"*" = [
    "*.md",
    "*.onnx",
    "*.pickle.gz",
    "*.png",
    "*.rnc",
    "*.rng",
    "*.txt",
    "*.typed",
    "*.xsd",
    "*.yaml",
    "LICENSE",
    "cmap/*.pickle.gz",
    "cmap/*.txt",
    "models/*.onnx",
]
