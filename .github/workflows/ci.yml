name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    plugin:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: plugin
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  package_json_file: plugin/package.json

            - name: Install plugin deps
              run: pnpm install --frozen-lockfile

            - name: Lint plugin
              run: pnpm lint:check

            - name: Test plugin
              run: pnpm test

            - name: Build plugin
              run: pnpm build

            - name: Upload XPI
              uses: actions/upload-artifact@v7
              with:
                  name: zotero-pdf2zh-next-xpi-${{ github.sha }}
                  path: plugin/build/zotero-pdf2zh-next.xpi
                  if-no-files-found: error
                  retention-days: 30

    server:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup uv
              uses: astral-sh/setup-uv@v8.3.2

            - name: Test release orchestration
              run: uv run --no-project python -m unittest discover -s scripts/tests -v

            - name: Run server tests
              run: uv run python -m unittest discover -s tests
              working-directory: server

            - name: Validate PyPI artifacts
              run: |
                  VERSION="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("server/pyproject.toml", "rb"))["project"]["version"])')"
                  uv build server --out-dir server/dist --clear --no-sources
                  uv run --no-project python scripts/check_pypi_artifacts.py server/dist "$VERSION"

    docker:
        needs: [plugin, server]
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Set image destination
              id: image
              env:
                  REPOSITORY: ${{ github.repository }}
              run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v4

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  flavor: latest=false
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,format=long

            - name: Log in to GHCR
              if: github.ref == 'refs/heads/main'
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: server/Dockerfile
                  platforms: linux/amd64
                  push: ${{ github.ref == 'refs/heads/main' }}
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
